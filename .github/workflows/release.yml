name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_tag:
        description: 'Existing release tag to rebuild and retry (e.g. v0.1.0); empty updates the release PR'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'sambhav/gobridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        if: inputs.retry_tag == ''
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN does not trigger pull_request workflows. An explicit
      # dispatch does, without requiring a personal GitHub token.
      - uses: actions/github-script@v7
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS || '[]')) {
              const {data} = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'ci.yml', ref: data.head.ref
              });
            }
      - uses: actions/github-script@v7
        id: select
        env:
          RETRY_TAG: ${{ inputs.retry_tag }}
          CREATED_TAG: ${{ steps.release.outputs.tag_name }}
          CREATED: ${{ steps.release.outputs.release_created }}
        with:
          script: |
            const tag = process.env.RETRY_TAG || (process.env.CREATED === 'true' ? process.env.CREATED_TAG : '');
            if (!tag) return;
            if (!/^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/.test(tag))
              throw new Error('Use an existing stable vX.Y.Z release tag');
            const {data: release} = await github.rest.repos.getReleaseByTag({...context.repo, tag});
            if (release.draft || release.prerelease) throw new Error('Expected a stable GitHub release');
            const {data: commit} = await github.rest.repos.getCommit({...context.repo, ref: tag});
            const {data: ancestry} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${commit.sha}...main`
            });
            if (!['ahead', 'identical'].includes(ancestry.status)) throw new Error('Release must be an ancestor of main');
            const {data: file} = await github.rest.repos.getContent({...context.repo, path: 'version.txt', ref: commit.sha});
            if (Buffer.from(file.content, 'base64').toString().trim() !== tag.slice(1))
              throw new Error('Tag and source version disagree');
            core.setOutput('tag', tag);
            core.setOutput('sha', commit.sha);
  validate:
    needs: plan
    if: needs.plan.outputs.tag != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}
  artifacts:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build CLI archives after all package checks pass
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python tools/release.py prepare --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts/*
          if-no-files-found: error
  archive:
    needs: [plan, artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - name: Attach immutable artifacts and checksums to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: python tools/release.py github --tag "$RELEASE_TAG"
