name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go build -o bin/textkit ./examples/textkit
      - run: go test -run '^$' -bench . -benchmem > go-bench.txt
      - run: python tools/benchmark.py --calls 1000 > python-bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            go-bench.txt
            python-bench.json
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "./python[dev]"
      - run: python tools/check.py
  wheel-install:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - run: python tools/test_wheel.py
      - run: python tools/test_wheel.py --example hello
  minimum-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test -race ./...
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install setuptools wheel
      - run: python tools/build_wheels.py
      - run: python tools/build_wheels.py --go-package ./examples/hello --package hello --class Hello --binary hello --distribution gobridge-hello-example
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
