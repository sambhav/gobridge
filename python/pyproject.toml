[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gobridge-runtime"
version = "1.0.0"
description = "Process-owned Python bindings for typed Go operations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.urls]
Repository = "https://github.com/sambhav/gobridge"
Documentation = "https://github.com/sambhav/gobridge#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gobridge = ["py.typed"]
